server:
  port: ${PORT:8080}

spring:
  application:
    name: clube-desportivo

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        default_schema: ${SPRING_JPA_DEFAULT_SCHEMA:public}
        format_sql: ${SPRING_JPA_FORMAT_SQL:false}
        use_sql_comments: ${SPRING_JPA_USE_SQL_COMMENTS:false}

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}

payment-gateway:
  mock-enabled: ${PAYMENT_GATEWAY_MOCK_ENABLED:true}
  sandbox-url: ${PAYMENT_GATEWAY_SANDBOX_URL:}
  entity: ${PAYMENT_GATEWAY_ENTITY:}
  api-key: ${PAYMENT_GATEWAY_API_KEY:}

app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

  fees:
    monthly-generation-cron: ${MONTHLY_FEE_GENERATION_CRON:0 0 3 1 * *}

logging:
  level:
    root: INFO
    com.sportsclub: ${APP_LOG_LEVEL:INFO}
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG_LEVEL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never
